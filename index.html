<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fluxo — Experience in Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>

/* ── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', sans-serif;
  display: flex; min-height: 100vh;
  background: #F4F7F4;
}

/* ── TOKENS ────────────────────────────────────────── */
:root {
  --bg:       #F4F7F4;
  --surface:  #FFFFFF;
  --surface2: #EBF0EB;
  --border:   rgba(0,0,0,.08);
  --border2:  rgba(0,0,0,.13);
  --green:    #3A8A41;
  --green-light: #7FCE85;
  --green-bg: rgba(58,138,65,.08);
  --text:     #0D1A0F;
  --muted:    rgba(13,26,15,.48);
  --muted2:   rgba(13,26,15,.28);
}

/* ── MAIN AREA ──────────────────────────────────────── */
.main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 52px; padding-top: 72px; min-height: 100vh; position: relative; overflow: hidden;
}

/* ambient glow */
.main::before {
  content: '';
  position: absolute; top: 50%; left: 50%;
  width: 700px; height: 500px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(127,206,133,.14) 0%, transparent 68%);
  pointer-events: none;
}

/* subtle grid */
.main::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 100%);
}

/* ── CONTENT WRAPPER ────────────────────────────────── */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; max-width: 640px; width: 100%;
  gap: 0; margin-bottom: 120px;
}

/* ── HERO GROUP — logo + headline centered ── */
.hero-group {
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; margin-bottom: 48px;
}
.hero-group .hero-logo {
  height: 140px; width: auto; display: block;
}
.hero-group .headline {
  margin-bottom: 0;
  font-size: clamp(1.3rem, 2.6vw, 1.65rem);
  text-align: center;
  white-space: normal;
}

/* ── STATUS CHIP ────────────────────────────────────── */
.status-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid rgba(58,138,65,.25);
  background: rgba(58,138,65,.07);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 500; letter-spacing: .1em;
  color: var(--green); text-transform: uppercase;
  margin-bottom: 52px;
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 8px;
  background: var(--green); flex-shrink: 0;
}

/* ── HEADLINE ───────────────────────────────────────── */
.headline {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 300; letter-spacing: -1.5px; line-height: 1.12;
  color: var(--text); margin-bottom: 55px;
}

/* ── SUBLINE ────────────────────────────────────────── */
.subline {
  font-size: 0.95rem; line-height: 1.7; color: var(--muted);
  max-width: 480px; margin-bottom: 48px;
}

/* ── PROGRESS TRACK ─────────────────────────────────── */
.progress-track {
  width: 100%; margin-bottom: 44px;
}
.track-stages {
  display: flex; align-items: center; justify-content: center;
  gap: 0; width: 100%; position: relative;
}
.stage {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  flex: 1; position: relative;
}
.stage-connector {
  flex: 1; height: 1px; position: relative; top: -10px;
}
.stage-connector::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: var(--border);
}
.stage-connector.done::before {
  background: linear-gradient(90deg, var(--green), rgba(58,138,65,.3));
}
.stage-connector.active::before {
  background: linear-gradient(90deg, rgba(58,138,65,.35), var(--border));
}

.stage-node {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
  position: relative; z-index: 1;
  transition: box-shadow .3s;
}
.stage-node.done {
  background: rgba(58,138,65,.12); border: 1.5px solid rgba(58,138,65,.45);
  color: var(--green);
}
.stage-node.active {
  background: rgba(58,138,65,.1); border: 1.5px solid var(--green);
  color: var(--green);
  box-shadow: 0 0 0 4px rgba(58,138,65,.08), 0 0 16px rgba(58,138,65,.12);
}
.stage-node.queued {
  background: rgba(0,0,0,.04); border: 1.5px solid rgba(0,0,0,.12);
  color: var(--muted2);
}

.stage-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap;
}
.stage.done   .stage-label { color: rgba(58,138,65,.7); }
.stage.active .stage-label { color: var(--green); }
.stage.queued .stage-label { color: var(--muted2); }

/* ── MODULE STATUS CARDS ────────────────────────────── */
.module-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; width: 100%; margin-bottom: 44px;
}
.module-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 14px;
  text-align: left; position: relative; overflow: hidden;
  transition: transform .2s, border-color .2s, box-shadow .2s;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.module-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(58,138,65,.3), transparent);
  opacity: 0; transition: opacity .3s;
}
.module-card:hover {
  transform: translateY(-3px);
  border-color: rgba(58,138,65,.25);
  box-shadow: 0 8px 28px rgba(0,0,0,.1), 0 0 0 1px rgba(58,138,65,.12);
}
.module-card:hover::before { opacity: 1; }

.module-icon {
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.module-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.78rem; font-weight: 700; color: var(--text);
  margin-bottom: 6px; line-height: 1.3;
}
.module-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem; font-weight: 500; letter-spacing: .07em;
  text-transform: uppercase; padding: 3px 8px;
  border-radius: 8px;
}
.status-complete { background: rgba(58,138,65,.1);  color: #2E7035; border: 1px solid rgba(58,138,65,.2); }
.status-building { background: rgba(180,130,0,.09); color: #8a6200; border: 1px solid rgba(180,130,0,.2); }
.status-queued   { background: rgba(0,0,0,.05);    color: var(--muted2); border: 1px solid rgba(0,0,0,.1); }

.status-dot {
  width: 5px; height: 5px; border-radius: 8px; flex-shrink: 0;
}
.status-complete .status-dot { background: #3A8A41; }
.status-building .status-dot { background: #a07800; }
.status-queued   .status-dot { background: var(--muted2); }

/* ── CTA AREA ───────────────────────────────────────── */
.cta-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
}

.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 22px; border-radius: 8px;
  background: rgba(255,255,255,.55); color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.85rem; font-weight: 600; cursor: pointer;
  border: 1px solid rgba(0,0,0,.32);
  transition: color .15s, border-color .2s, background .15s, transform .15s;
}
.btn-ghost:hover {
  color: var(--text);
  border-color: rgba(58,138,65,.35);
  background: rgba(58,138,65,.05);
  transform: translateY(-2px);
}
.btn-ghost svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 24px; border-radius: 8px;
  background: var(--green); color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  border: none; text-decoration: none;
  transition: background .15s, transform .15s, box-shadow .15s;
  box-shadow: 0 2px 12px rgba(58,138,65,.28);
}
.btn-primary:hover {
  background: #2F7535;
  transform: translateY(-2px);
  box-shadow: 0 4px 18px rgba(58,138,65,.38);
}
.btn-primary svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── PAGE LOGO ──────────────────────────────────────── */
.page-logo {
  position: fixed; top: 22px; left: 28px; z-index: 10;
  display: inline-flex; align-items: center;
  text-decoration: none; user-select: none;
}
.page-logo svg {
  height: 28px;
  width: auto;
  display: block;
}

/* ── ARROW ANIMATION ────────────────────────────────── */
.arrow-stage {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
  opacity: 0.52;
}
.arrow-stage svg { width: 100%; height: 100%; }

/* ── NOTIFY MODAL ───────────────────────────────────── */
.notify-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 20, 12, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.notify-overlay.open {
  opacity: 1; pointer-events: all;
}
.notify-modal {
  position: relative;
  background: #FFFFFF;
  border: 1px solid rgba(0,0,0,.09);
  border-radius: 8px;
  padding: 40px 40px 36px;
  width: 100%; max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,.13), 0 4px 16px rgba(0,0,0,.07);
  transform: translateY(14px) scale(0.97);
  transition: transform .25s cubic-bezier(.22,1,.36,1);
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.notify-overlay.open .notify-modal {
  transform: translateY(0) scale(1);
}

.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 30px; height: 30px; border-radius: 8px;
  background: transparent; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted);
  transition: background .15s, color .15s, border-color .15s;
}
.modal-close:hover {
  background: rgba(0,0,0,.05); color: var(--text);
  border-color: rgba(0,0,0,.15);
}
.modal-close svg { width: 13px; height: 13px; }

.modal-bell {
  width: 44px; height: 44px; border-radius: 8px;
  background: rgba(58,138,65,.1);
  border: 1px solid rgba(58,138,65,.2);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.modal-bell svg { width: 20px; height: 20px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.modal-title {
  font-size: 1.2rem; font-weight: 700; letter-spacing: -0.4px;
  color: var(--text); margin-bottom: 6px;
}
.modal-desc {
  font-size: 0.875rem; color: var(--muted); line-height: 1.55;
  margin-bottom: 26px;
}

.modal-form { display: flex; flex-direction: column; gap: 14px; }

.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-group label {
  font-size: 0.78rem; font-weight: 600; color: var(--text);
  letter-spacing: 0.01em;
}
.field-group input {
  padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(0,0,0,.13);
  background: #FAFAFA;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.88rem; color: var(--text);
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
.field-group input::placeholder { color: rgba(13,26,15,.32); }
.field-group input:focus {
  border-color: rgba(58,138,65,.55);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(58,138,65,.1);
}
.field-group input.invalid {
  border-color: rgba(210,50,50,.5);
  box-shadow: 0 0 0 3px rgba(210,50,50,.08);
}
.field-error {
  font-size: 0.74rem; color: #c0392b;
  margin-top: 1px; display: none;
}
.field-error.visible { display: block; }

.modal-submit {
  margin-top: 6px;
  padding: 12px 20px; border-radius: 8px;
  background: var(--green); color: #FFFFFF;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.88rem; font-weight: 700;
  border: none; cursor: pointer;
  transition: background .15s, transform .15s, box-shadow .15s;
  box-shadow: 0 2px 10px rgba(58,138,65,.3);
}
.modal-submit:hover {
  background: #2F7535;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(58,138,65,.38);
}
.modal-submit:active { transform: translateY(0); }

/* Success state */
.modal-success {
  display: none; flex-direction: column; align-items: center;
  text-align: center; padding: 12px 0 4px;
}
.modal-success.show { display: flex; }
.modal-form.hide { display: none; }

.success-check {
  width: 52px; height: 52px; border-radius: 8px;
  background: rgba(58,138,65,.1); border: 1.5px solid rgba(58,138,65,.3);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.success-check svg { width: 22px; height: 22px; stroke: var(--green); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.success-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.success-sub { font-size: 0.84rem; color: var(--muted); line-height: 1.55; }

/* ── RESPONSIVE ─────────────────────────────────────── */
@media (max-width: 860px) {
  .main { padding: 32px 24px; align-items: flex-start; padding-top: 60px; }
  .module-grid { grid-template-columns: 1fr 1fr; }
  .headline { font-size: 1.8rem; }
}
@media (max-width: 520px) {
  .module-grid { grid-template-columns: 1fr; }
  .track-stages { gap: 0; }
  .stage-label { font-size: 0.54rem; }
}

</style>
</head>
<body>


<!-- ── MAIN CONTENT ──────────────────────────────── -->
<main class="main">
  <!-- Full-screen plasma arrows — JS-redrawn every frame, always edge-to-edge -->
  <div class="arrow-stage">
    <svg id="arrow-svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">
      <defs>

        <!-- Left-edge transparent → right-edge bright (objectBoundingBox = follows shape) -->
        <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#3D9648" stop-opacity="0"/>
          <stop offset="14%"  stop-color="#3D9648" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#52C060" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="g-gh" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#C0FFC8" stop-opacity="0"/>
          <stop offset="18%"  stop-color="#C0FFC8" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="#E8FFEC" stop-opacity="0.50"/>
        </linearGradient>

        <!-- Ethereal glow — green -->
        <filter id="f-green" x="-2%" y="-500%" width="104%" height="1100%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="44" result="b1"/>
          <feFlood flood-color="#3D9648" flood-opacity="0.60" result="c1"/>
          <feComposite in="c1" in2="b1" operator="in" result="outer"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b2"/>
          <feFlood flood-color="#60D472" flood-opacity="0.75" result="c2"/>
          <feComposite in="c2" in2="b2" operator="in" result="inner"/>
          <feMerge>
            <feMergeNode in="outer"/>
            <feMergeNode in="inner"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>


      </defs>

      <!-- Green arrow — path data set by JS each frame -->
      <g filter="url(#f-green)">
        <path id="ap-green"    fill="url(#g-green)"/>
        <path id="ap-green-hi" fill="url(#g-gh)"/>
      </g>

    </svg>
  </div>

  <div class="content">

    <!-- Hero group: logo + headline share the same width -->
    <div class="hero-group">
      <svg class="hero-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2193.5 930.8" role="img" aria-label="Fluxo">
        <g transform="translate(29.8,834.1) scale(1,-1)">
          <path transform="translate(0.0,0)" d="M121.5 0V535.25Q121.5 592.5 146.875 637.125Q172.25 681.75 218.125 707.625Q264 733.5 325.5 733.5Q372.5 733.5 406.625 717.75Q440.75 702 468.25 673.5L384.75 590Q374 601 360.75 607.125Q347.5 613.25 328 613.25Q292.25 613.25 272.625 593.625Q253 574 253 538.25V0ZM10.25 368V483H395.5V368Z" fill="#0D1A0F"/>
          <path transform="translate(379.0,0)" d="M57.5 0V723H189V0Z" fill="#0D1A0F"/>
          <path transform="translate(586.0,0)" d="M263.75 -10.5Q200.29676258992805 -10.5 150.64838129496403 16.75Q101 44 73.125 92.00954653937947Q45.25 140.01909307875894 45.25 202.759502881425V483H176.75V206Q176.75 175.96142857142857 186.96875 154.65214285714285Q197.1875 133.34285714285716 216.96394230769232 121.92142857142858Q236.7403846153846 110.5 263.99568965517244 110.5Q305 110.5 327.75 135.515Q350.5 160.53 350.5 206V483H482V202.75Q482 139.25 454.25 91.25Q426.5 43.25 377.32374100719426 16.375Q328.1474820143885 -10.5 263.75 -10.5Z" fill="#0D1A0F"/>
          <path transform="translate(1580.5,0)" d="M284.5 -10.5Q211.75 -10.5 153.125 23.0Q94.5 56.5 60.25 114.0Q26 171.5 26 242.5Q26 313.5 60.125 370.0Q94.25 426.5 152.875 460.0Q211.5 493.5 284.25 493.5Q357.75 493.5 416.25 460.375Q474.75 427.25 509.0 370.375Q543.25 313.5 543.25 242.5Q543.25 171.5 509.125 114.0Q475 56.5 416.5 23.0Q358 -10.5 284.5 -10.5ZM284.25 112Q321.25 112 349.5 128.5Q377.75 145 393.375 174.625Q409 204.25 409 242.25Q409 280.25 392.875 309.125Q376.75 338 349.0 354.5Q321.25 371 284.25 371Q248.25 371 220.0 354.375Q191.75 337.75 176.0 308.875Q160.25 280 160.25 242Q160.25 204.25 176.0 174.625Q191.75 145 220.0 128.5Q248.25 112 284.25 112Z" fill="#0D1A0F"/>
          <g>
            <path stroke="#0D1A0F" stroke-linecap="butt" stroke-width="113.3" d="M1116.6 503.9 L1554.4 66.1"/>
            <path stroke="#4FB87A" fill="none" stroke-linecap="butt" stroke-width="82.6" d="M1071.8 47.2 C1303.9 26.0 1309.1 314.5 1425.7 421.8"/>
            <path fill="#4FB87A" stroke="none" d="M1599.2 581.7 L1353.7 499.9 L1497.6 343.7 Z"/>
          </g>
        </g>
      </svg>
      <h1 class="headline">Your experience is being assembled.</h1>
    </div>


    <!-- CTA -->
    <div class="cta-row">
      <button class="btn-ghost" id="notifyBtn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notify me on launch
      </button>
    </div>

  </div>
</main>

<!-- ── NOTIFY MODAL ───────────────────────────────── -->
<div id="notifyOverlay" class="notify-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="notify-modal">

    <!-- Close button -->
    <button class="modal-close" id="modalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <!-- Icon -->
    <div class="modal-bell">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>

    <h2 class="modal-title" id="modalTitle">Get notified at launch</h2>
    <p class="modal-desc">Drop your details below and we'll reach out the moment this goes live.</p>

    <!-- Form -->
    <form class="modal-form" id="notifyForm" novalidate>
      <div class="field-group">
        <label for="modalName">Full Name</label>
        <input type="text" id="modalName" name="fullName" placeholder="Jane Smith" autocomplete="name"/>
        <span class="field-error" id="nameError">Please enter your full name.</span>
      </div>
      <div class="field-group">
        <label for="modalEmail">Email</label>
        <input type="email" id="modalEmail" name="email" placeholder="jane@example.com" autocomplete="email"/>
        <span class="field-error" id="emailError">Please enter a valid email address.</span>
      </div>
      <button type="submit" class="modal-submit">Notify me at launch</button>
    </form>

    <!-- Success state (hidden until submit) -->
    <div class="modal-success" id="modalSuccess">
      <div class="success-check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="success-title">You're on the list</div>
      <p class="success-sub">We'll send you an email the moment this experience is ready.</p>
    </div>

  </div>
</div>

<script>

/* ── 3D TILT on module cards ─────────────────────── */
document.querySelectorAll('.module-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - 0.5;
    const y = (e.clientY - r.top)  / r.height - 0.5;
    card.style.transform = `translateY(-3px) rotateY(${x * 7}deg) rotateX(${-y * 7}deg)`;
  });
  card.addEventListener('mouseleave', () => { card.style.transform = ''; });
});

/* ── NOTIFY MODAL ────────────────────────────────── */
const notifyBtn    = document.getElementById('notifyBtn');
const overlay      = document.getElementById('notifyOverlay');
const modalClose   = document.getElementById('modalClose');
const notifyForm   = document.getElementById('notifyForm');
const modalSuccess = document.getElementById('modalSuccess');

const nameInput  = document.getElementById('modalName');
const emailInput = document.getElementById('modalEmail');
const nameError  = document.getElementById('nameError');
const emailError = document.getElementById('emailError');

function clearError(input, errorEl) {
  input.classList.remove('invalid');
  errorEl.classList.remove('visible');
}
function showError(input, errorEl) {
  input.classList.add('invalid');
  errorEl.classList.add('visible');
}
function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function openModal() {
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  notifyForm.classList.remove('hide');
  modalSuccess.classList.remove('show');
  notifyForm.reset();
  clearError(nameInput, nameError);
  clearError(emailInput, emailError);
  setTimeout(() => nameInput.focus(), 80);
}
function closeModal() {
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
}

notifyBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);

// Clear errors as the user types
nameInput.addEventListener('input',  () => clearError(nameInput,  nameError));
emailInput.addEventListener('input', () => clearError(emailInput, emailError));

// Close on backdrop click
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Form submit — validate both fields before accepting
notifyForm.addEventListener('submit', e => {
  e.preventDefault();
  const name  = nameInput.value.trim();
  const email = emailInput.value.trim();

  let valid = true;
  if (!name) {
    showError(nameInput, nameError);
    valid = false;
  }
  if (!email || !isValidEmail(email)) {
    showError(emailInput, emailError);
    valid = false;
  }
  if (!valid) {
    // Shake the first invalid field
    const first = !name ? nameInput : emailInput;
    first.focus();
    return;
  }

  // Both fields valid — show success
  notifyForm.classList.add('hide');
  modalSuccess.classList.add('show');

  // Mark button as done, close after user has read the message
  setTimeout(() => {
    closeModal();
    notifyBtn.innerHTML = `
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
      You're on the list
    `;
    notifyBtn.style.color = '#3A8A41';
    notifyBtn.style.borderColor = 'rgba(58,138,65,.35)';
  }, 2600);
});

/* ── PLASMA ARROWS — full-screen, redrawn each frame ── */
(function () {
  const VW = 1200, VH = 750;          // matches SVG viewBox
  const STEPS = 90;                    // sample points along each arrow
  const NECK  = Math.floor(STEPS * 0.88); // where body ends and arrowhead begins

  const apGreen   = document.getElementById('ap-green');
  const apGreenHi = document.getElementById('ap-green-hi');

  // Shader-accurate wave: (cos(t) + cos(1.3t+1.3) + cos(1.4t+1.4)) / 3
  function plasma(t) {
    return (Math.cos(t) + Math.cos(t * 1.3 + 1.3) + Math.cos(t * 1.4 + 1.4)) / 3;
  }

  // Compute centre-line points — wave travels right-to-left (tail churns, head stays still)
  function wave(time, yCtrFrac, amp, freq, phase) {
    const pts = [];
    for (let i = 0; i <= STEPS; i++) {
      const x = (i / STEPS) * VW;
      const nx = x / VW;
      // +time  → pattern moves in -x direction (right-to-left / "backwards")
      // Fade reaches 0 exactly at the neck (nx = NECK/STEPS) so the entire
      // arrowhead region (neck → tip) has zero displacement — head never moves.
      const neckFrac = NECK / STEPS;
      const fade = nx <= neckFrac
        ? Math.cos((nx / neckFrac) * Math.PI * 0.5)
        : 0;
      const y = yCtrFrac * VH + plasma(nx * freq + time + phase) * amp * fade;
      pts.push({ x, y });
    }
    return pts;
  }

  // Build the filled arrow-ribbon polygon from centre-line points
  function ribbon(pts, hw, flare) {
    const neck = NECK, tip = pts[pts.length - 1];
    let d = '';
    // Top edge (left → neck)
    for (let i = 0; i <= neck; i++)
      d += (i ? ' L' : 'M') + ` ${pts[i].x.toFixed(1)},${(pts[i].y - hw).toFixed(1)}`;
    // Arrowhead flare → tip → bottom flare
    d += ` L ${pts[neck].x.toFixed(1)},${(pts[neck].y - flare).toFixed(1)}`;
    d += ` L ${tip.x.toFixed(1)},${tip.y.toFixed(1)}`;
    d += ` L ${pts[neck].x.toFixed(1)},${(pts[neck].y + flare).toFixed(1)}`;
    // Bottom edge (neck → left)
    for (let i = neck; i >= 0; i--)
      d += ` L ${pts[i].x.toFixed(1)},${(pts[i].y + hw).toFixed(1)}`;
    return d + ' Z';
  }

  // Narrow highlight strip across the top face (3-D cylinder sheen)
  function sheen(pts, hw, flare) {
    const neck = NECK, tip = pts[pts.length - 1];
    let d = '';
    for (let i = 0; i <= neck; i++)
      d += (i ? ' L' : 'M') + ` ${pts[i].x.toFixed(1)},${(pts[i].y - hw * 0.95).toFixed(1)}`;
    d += ` L ${pts[neck].x.toFixed(1)},${(pts[neck].y - flare * 0.82).toFixed(1)}`;
    d += ` L ${tip.x.toFixed(1)},${tip.y.toFixed(1)}`;
    for (let i = neck; i >= 0; i--)
      d += ` L ${pts[i].x.toFixed(1)},${(pts[i].y - hw * 0.28).toFixed(1)}`;
    return d + ' Z';
  }

  let t0 = null;
  function frame(ts) {
    if (!t0) t0 = ts;
    const t = (ts - t0) * 0.001 * 0.8;

    const gPts = wave(t, 0.78, VH * 0.07, 9, Math.PI * 1.1);
    apGreen.setAttribute('d',    ribbon(gPts, 24, 62));
    apGreenHi.setAttribute('d',  sheen (gPts, 24, 62));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ── CONTENT ENTRANCE ────────────────────────────── */
document.querySelectorAll('.status-chip, .headline, .subline, .progress-track, .module-grid, .cta-row').forEach((el, i) => {
  el.style.opacity = '0';
  el.style.transform = 'translateY(18px)';
  el.style.transition = `opacity .55s ease ${i * 0.09}s, transform .55s ease ${i * 0.09}s`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }));
});
</script>
</body>
</html>
